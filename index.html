<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-gradient"></div>

    <header>
        <nav class="glass-panel">
            <div class="logo">Portfolio.</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="https://github.com/Tsukoro" target="_blank">GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero-section">
            <div class="hero-content">
                <h1 class="animate-text">Hello, I'm <span class="highlight">Erik</span></h1>
                <p class="subtitle animate-text delay-1">Business Informatics Student @CAU</p>
                <a href="#projects" class="cta-button animate-text delay-2">View Work</a>
            </div>
        </section>

        <section id="projects" class="projects-section">
            <h2 class="section-title">My Projects</h2>
            <div id="projects-grid" class="projects-grid">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Erik. Built with HTML, CSS & JS.</p>
    </footer>

    <script src="projects.js"></script>
    <script src="script.js"></script>

</html>
